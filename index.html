<!DOCTYPE html>
<html lang="as" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#141210" />
    <title>Asomiya Web Editor — editor.asomiya.codes</title>
    
    <!-- Fonts: Kohinoor Bangla declaration & Noto Sans Bengali fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
      @font-face {
        font-family: 'Kohinoor Bangla';
        src: local('Kohinoor Bangla'),
             local('KohinoorBangla-Regular'),
             local('KohinoorBangla'),
             local('Kohinoor-Bangla');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Kohinoor Bangla';
        src: local('Kohinoor Bangla Medium'),
             local('KohinoorBangla-Medium'),
             local('KohinoorBangla-Semibold');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Kohinoor Bangla';
        src: local('Kohinoor Bangla Bold'),
             local('KohinoorBangla-Bold'),
             local('KohinoorBangla-Heavy');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body class="overflow-hidden m-0 p-0 select-none bg-[#1e1e1e] text-[#cccccc]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
